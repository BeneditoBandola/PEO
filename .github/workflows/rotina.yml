name: Execucao Diaria PDV Pet

on:
  schedule:
    # 12:05 UTC equivale às 09:05 da manhã no Horário de Brasília (UTC-3)
    # (Usar o minuto 05 evita o congestionamento de fila do GitHub no minuto 00)
    - cron: '5 12 * * *'
    
  workflow_dispatch: # Permite rodar manualmente a qualquer momento para testar

jobs:
  executar-script:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependencias do Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Navegador Playwright
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Executar Automação e Enviar E-mails
        env:
          USUARIO_PDV: ${{ secrets.USUARIO_PDV }}
          SENHA_PDV: ${{ secrets.SENHA_PDV }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          SENHA_EMAIL: ${{ secrets.SENHA_EMAIL }}
        run: python peo.py
